<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d6b66">
  <meta name="description" content="Verify Punjab route permit by vehicle registration number.">
  <title>Verify Route Permit — Punjab PTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink: #0f1f33;
      --sea: #0d6b66;
      --sea-light: #14a89f;
      --sea-deep: #064842;
      --line: rgba(15, 31, 51, 0.1);
      --card: rgba(255, 255, 255, 0.92);
      --muted: #5c6d78;
      --font: "Outfit", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 0% -20%, rgba(13, 107, 102, 0.22), transparent 55%),
        radial-gradient(900px 400px at 100% 0%, rgba(15, 31, 51, 0.08), transparent 50%),
        linear-gradient(165deg, #f0f9f7 0%, #eef4f8 45%, #f5f7fa 100%);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(680px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 calc(56px + env(safe-area-inset-bottom));
    }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(13, 107, 102, 0.1);
      border: 1px solid rgba(13, 107, 102, 0.18);
      color: var(--sea-deep);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .hero-badge svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .hero h1 {
      margin: 0 0 12px;
      font-family: var(--display);
      font-size: clamp(1.85rem, 5.5vw, 2.55rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .hero p {
      margin: 0 auto;
      max-width: 42ch;
      color: var(--muted);
      font-size: clamp(0.98rem, 2.4vw, 1.08rem);
      line-height: 1.55;
    }
    .hero p strong {
      color: var(--ink);
      font-weight: 600;
    }
    .verify-card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: clamp(20px, 4vw, 28px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 24px 48px rgba(15, 31, 51, 0.08);
    }
    .verify-card label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .search-row {
      display: flex;
      gap: 10px;
    }
    .search-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background: #f8fbfc;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .search-row input:focus {
      border-color: var(--sea);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(13, 107, 102, 0.12);
    }
    .search-row button {
      border: none;
      border-radius: 14px;
      min-height: 52px;
      padding: 0 22px;
      background: linear-gradient(145deg, var(--sea) 0%, var(--sea-deep) 100%);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(13, 107, 102, 0.28);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .search-row button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(13, 107, 102, 0.32);
    }
    .search-row button:active { transform: translateY(0); }
    .search-row button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }
    .hint {
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    #status {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--sea-deep);
      min-height: 1.2em;
    }
    .result {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #f8fafb;
    }
    .result-head {
      padding: 14px 16px;
      background: linear-gradient(90deg, #e4f3f0, #eef6f4);
      border-bottom: 1px solid var(--line);
      font-weight: 750;
      font-size: 14px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .field {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .field:nth-child(2n) { border-right: none; }
    .field .lbl {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }
    .field .val {
      font-size: 14px;
      font-weight: 650;
      word-break: break-word;
    }
    .result-actions {
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .result-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
    }
    .result-actions a.secondary {
      background: #e8f0ee;
      color: var(--ink);
    }
    .empty {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(220, 38, 38, 0.07);
      border: 1px solid rgba(220, 38, 38, 0.15);
      color: #b91c1c;
      font-size: 14px;
      font-weight: 600;
    }
    .site-foot {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .site-foot span {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--line);
    }
    @media (max-width: 560px) {
      .search-row { flex-direction: column; }
      .search-row button { width: 100%; min-height: 48px; }
      .result-grid { grid-template-columns: 1fr; }
      .field { border-right: none; }
      .result-actions a { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm-1 16-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8Z"/></svg>
        Official verification
      </div>
      <h1>Verify Route Permit</h1>
      <p>Check permit details for a vehicle registered with <strong>Punjab Provincial Transport Authority</strong>.</p>
    </header>

    <section class="verify-card" aria-label="Permit verification">
      <label for="reg-input">Vehicle registration number</label>
      <div class="search-row">
        <input id="reg-input" type="text" placeholder="e.g. LEB-1234 or TAK 325 PESHAWAR" autocomplete="off" inputmode="text">
        <button id="verify-btn" type="button">Verify</button>
      </div>
      <p class="hint">Try with or without spaces or dashes if the first search returns no results.</p>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="results"></div>
    </section>

    <footer class="site-foot">
      <span>pdtg-transport-punjab.com</span>
    </footer>
  </div>

  <script>
    var SUPABASE_URL = 'https://meqkwnujbuovzzeyjywo.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lcWt3bnVqYnVvdnp6ZXlqeXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIxMTcsImV4cCI6MjA5NjU3ODExN30.1FkeN3NZnT1vmE5QRul0sgF4HMw2wx9Y2wMSdQVgJSc';
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function normalizeRegKey(value) {
      return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function field(label, value) {
      return '<div class="field"><span class="lbl">' + label + '</span><span class="val">' + escapeHtml(value || '-') + '</span></div>';
    }

    function renderResults(rows) {
      var box = document.getElementById('results');
      if (!rows.length) {
        box.innerHTML = '<div class="empty">No route permit found for this registration number.</div>';
        return;
      }
      box.innerHTML = rows.map(function(r) {
        var id = r.id;
        var html = '<div class="result">';
        html += '<div class="result-head">' + escapeHtml(r.full_name || 'Owner') + ' — ' + escapeHtml(r.vehicle_reg_no || '') + '</div>';
        html += '<div class="result-grid">';
        html += field('Owner Name', r.full_name);
        html += field('CNIC / NTN', r.cnic_no);
        html += field('Vehicle Type', r.vehicle_type);
        html += field('Registration No', r.vehicle_reg_no);
        html += field('Engine No', r.engine_no);
        html += field('Chassis No', r.chassis_no);
        html += field('Route Permit No', r.route_permit_no);
        html += field('Application No', r.app_no);
        html += field('Valid From', r.valid_from);
        html += field('Valid Upto', r.valid_upto);
        html += field('Issuing District', r.issuing_district);
        html += field('Issuance Date', r.issuance_date);
        html += '</div>';
        html += '<div class="result-actions">';
        html += '<a href="permit.html?id=' + encodeURIComponent(id) + '">View full permit</a>';
        html += '<a class="secondary" href="https://mtmis.excise.punjab.gov.pk" target="_blank" rel="noopener noreferrer">Check Excise MTMIS</a>';
        html += '</div></div>';
        return html;
      }).join('');
    }

    async function verifyVehicle() {
      var input = document.getElementById('reg-input');
      var status = document.getElementById('status');
      var btn = document.getElementById('verify-btn');
      var raw = input.value.trim();
      document.getElementById('results').innerHTML = '';
      if (!raw) {
        status.textContent = 'Enter a registration number first.';
        return;
      }
      var key = normalizeRegKey(raw);
      status.textContent = 'Searching…';
      btn.disabled = true;
      try {
        var result = await sb.from('permits').select('*').order('created_at', { ascending: false });
        if (result.error) throw result.error;
        var matches = (result.data || []).filter(function(r) {
          var reg = normalizeRegKey(r.vehicle_reg_no);
          if (!reg) return false;
          return reg === key || reg.indexOf(key) !== -1 || key.indexOf(reg) !== -1;
        });
        status.textContent = matches.length
          ? (matches.length + ' permit record' + (matches.length > 1 ? 's' : '') + ' found')
          : 'No match in PTA permit database';
        renderResults(matches);
      } catch (err) {
        status.textContent = (err && err.message) || 'Verification failed';
      }
      btn.disabled = false;
    }

    document.getElementById('verify-btn').addEventListener('click', verifyVehicle);
    document.getElementById('reg-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verifyVehicle();
    });

    var params = new URLSearchParams(window.location.search);
    var preset = params.get('reg') || params.get('q') || '';
    if (preset) {
      document.getElementById('reg-input').value = preset;
      verifyVehicle();
    }
  </script>
</body>
</html>
