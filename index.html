<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Punjab Route Permit — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #102033;
      --sea: #0d6b66;
      --fog: #f3f7f5;
      --line: rgba(16,32,51,.12);
      --card: #fff;
      --muted: #5a6b68;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 380px at 15% -10%, rgba(13,107,102,.14), transparent 55%),
        linear-gradient(180deg, #f7fbf9, var(--fog));
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 14px 36px rgba(16,32,51,.1);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      line-height: 1.2;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .actions { display: grid; gap: 10px; }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      background: var(--ink);
      color: #fff;
    }
    a.btn.ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .note {
      margin: 18px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Punjab Route Permit</h1>
    <p>Staff login and permit tools for <strong>pdtg-transport-punjab.com</strong>. Public Vehicle Hub PK guides are hosted on the separate Vehicle Hub domain.</p>
    <div class="actions">
      <a class="btn" href="admin.html">Staff login</a>
      <a class="btn ghost" href="verify.html">Verify permit</a>
    </div>
    <p class="note">QR permit pages stay on this domain. Do not move <code>admin.html</code> / <code>permit.html</code> to the Vehicle Hub site.</p>
  </main>
</body>
</html>
